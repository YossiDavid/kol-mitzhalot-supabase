name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # הגרסה נלקחת מ-packageManager ב-package.json (מקור אמת אחד)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      # הגרסה נלקחת מ-packageManager ב-package.json (מקור אמת אחד)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # הסכמה נבנית מהמיגרציות ומהזרע בכל הרצה, בתוך קונטיינר חד-פעמי.
      # קודם לכן הבדיקות רצו מול פרויקט מרוחק שסכמתו נסחפה, ונפלו על עמודות,
      # טבלאות ופונקציות שחסרו שם. מסד שנבנה מאפס אינו יכול להיסחף.
      #
      # הגרסה מוצמדת ולא latest, כדי שהבנייה לא תישבר משדרוג צד שלישי.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Start local Supabase
        run: supabase start

      # מחיל מיגרציות וזרע באופן ודאי, בלי להסתמך על התנהגות ברירת מחדל של
      # start. בלי --linked הפקודה נוגעת אך ורק בסטאק המקומי שבקונטיינר,
      # לעולם לא בפרויקט ענן.
      - name: Apply migrations and seed
        run: supabase db reset

      # הכתובת והמפתחות נגזרים מהסטאק שרץ, ולא מסודות. כך אין בהרצה הזו
      # אישורים לשום סביבה אמיתית.
      - name: Export local Supabase credentials
        run: |
          # מסננים לשורות KEY=VALUE בלבד: ה-CLI מדפיס גם הודעות (שירותים
          # שנעצרו, גרסה חדשה זמינה), וכיום הן יוצאות ל-stderr — אבל אין
          # סיבה שהבנייה תישען על כך שזה יישאר כך.
          eval "$(supabase status -o env 2>/dev/null | grep -E '^[A-Z_0-9]+=')"
          # נפילה מיידית עם הודעה ברורה עדיפה על ייצוא ערכים ריקים, שהיה
          # מתגלה רק מאוחר יותר ככישלון בדיקות מבלבל.
          : "${API_URL:?supabase status did not report API_URL}"
          : "${PUBLISHABLE_KEY:?supabase status did not report PUBLISHABLE_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status did not report SERVICE_ROLE_KEY}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # ALLOW_REMOTE_E2E אינו מוגדר כאן במכוון: היעד באמת מקומי, ולכן
      # המנגנון שחוסם הרצה מול מסד שאינו מקומי עובר מעצמו במקום להיעקף.
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
